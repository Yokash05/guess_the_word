
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Word Game</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #dbeafe, #fce7f3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-card {
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            box-shadow: 0 8px 25px #0002;
        }

        #word {
            letter-spacing: 10px;
            font-size: 32px;
            font-weight: bold;
            color: #0d6efd;
        }

        #clue {
            background: #eff6ff;
            padding: 12px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card game-card mx-auto p-4 text-center">
        <h2 class="text-primary">Guess the Word!</h2>
        <p class="text-muted">
            Guess the hidden word before you run out of attempts.
        </p>

        <h5 class="mt-3">Hidden Word</h5>
        <div id="word" class="my-3">_ _ _ _ _</div>

        <!-- Clue section -->
        <h5>💡 Clue</h5>
        <p id="clue">Your clue will appear here.</p>

        <p>Attempts left: <span id="attempts">5</span></p>

        <div class="input-group mb-3">
            <input type="text" id="guess"
                   class="form-control"
                   placeholder="Enter a letter"
                   maxlength="1">

            <button class="btn btn-primary" onclick="checkWord()">
                Guess
            </button>
        </div>

        <p id="message" class="fw-bold"></p>

        <button class="btn btn-success" onclick="restartGame()">
            New Game
        </button>
    </div>
</div>

<script>
    let words = [
        {
            word: "APPLE",
            clue: "A fruit that can be red or green."
        },
        {
            word: "TIGER",
            clue: "A wild animal with orange fur and black stripes."
        },
        {
            word: "MANGO",
            clue: "A sweet tropical fruit known as the king of fruits."
        },
        {
            word: "GRAPE",
            clue: "A small fruit that grows in bunches."
        },
        {
            word: "BREAD",
            clue: "A food made from flour, often used to make sandwiches."
        },
        {
            word: "LION",
            clue: "I am the king of Forest"
        },
        {
            word: "CHEETAH",
            clue:"I am the Fastest Animal in the World"
        },
        
    ];

    let selectedWord;
    let guessedLetters;
    let attempts;
    let gameOver;

    function startGame() {
        let random = Math.floor(Math.random() * words.length);

        selectedWord = words[random].word;
        guessedLetters = [];
        attempts = 5;
        gameOver = false;

        // Display the clue for the selected word
        document.getElementById("clue").innerText =
            words[random].clue;

        document.getElementById("attempts").innerText = attempts;
        document.getElementById("message").innerText = "";

        let input = document.getElementById("guess");
        input.disabled = false;
        input.value = "";

        showWord();
    }

    function showWord() {
        let display = "";

        for (let i = 0; i < selectedWord.length; i++) {
            if (guessedLetters.includes(selectedWord[i])) {
                display += selectedWord[i] + " ";
            } else {
                display += "_ ";
            }
        }

        document.getElementById("word").innerText = display.trim();
    }

    function checkWord() {
        if (gameOver) return;

        let input = document.getElementById("guess");
        let letter = input.value.toUpperCase();
        let message = document.getElementById("message");

        if (!letter.match(/^[A-Z]$/)) {
            message.innerText = "Please enter one letter!";
            message.className = "text-danger fw-bold";
            input.value = "";
            return;
        }

        if (guessedLetters.includes(letter)) {
            message.innerText = "You already guessed that letter!";
            message.className = "text-warning fw-bold";
            input.value = "";
            return;
        }

        guessedLetters.push(letter);

        if (selectedWord.includes(letter)) {
            message.innerText = "Correct letter!";
            message.className = "text-success fw-bold";
        } else {
            attempts--;
            message.innerText = "Wrong letter!";
            message.className = "text-danger fw-bold";
        }

        document.getElementById("attempts").innerText = attempts;

        showWord();

        if ([...selectedWord].every(
            letter => guessedLetters.includes(letter)
        )) {
            message.innerText = "🎉 You won! The word was " + selectedWord;
            message.className = "text-success fw-bold";
            gameOver = true;

        } else if (attempts === 0) {
            message.innerText = "Game over! The word was " + selectedWord;
            message.className = "text-danger fw-bold";
            gameOver = true;
        }

        if (gameOver) {
            input.disabled = true;
        }

        input.value = "";

        if (!gameOver) {
            input.focus();
        }
    }

    function restartGame() {
        startGame();
    }

    document.getElementById("guess").addEventListener(
        "keydown",
        function(event) {
            if (event.key === "Enter") {
                checkWord();
            }
        }
    );

    startGame();
</script>

</body>
</html>
